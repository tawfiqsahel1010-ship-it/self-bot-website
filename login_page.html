<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#168acd">
<title>اتصال امن تلگرام</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;
justify-content:center;padding:20px;background:#eef5fb;
font-family:Tahoma,Arial,sans-serif;color:#172b3a}
.card{width:100%;max-width:420px;background:white;padding:30px 24px;
border-radius:22px;box-shadow:0 12px 40px #173b5818;text-align:center}
.logo{width:76px;height:76px;border-radius:50%;background:#168acd;
color:white;font-size:38px;display:grid;place-items:center;margin:0 auto 18px}
h1{font-size:23px;margin:0 0 12px}
p{font-size:14px;line-height:2;color:#617385}
.btn{display:block;text-decoration:none;background:#168acd;color:white;
padding:15px;border-radius:12px;font-size:16px;margin-top:22px}
.note{font-size:12px;background:#f2f7fb;padding:12px;border-radius:10px}
</style>
</head>
<body>
<main class="card">
<div class="logo">➤</div>
<h1>اتصال حساب تلگرام</h1>
<p>برای اتصال حساب خود به سرویس، از روش رسمی و امن تلگرام استفاده کنید.</p>
<a class="btn" href="https://telegram.org/">رفتن به وب‌سایت رسمی تلگرام</a>
<p class="note">کد ورود و رمز دومرحله‌ای خود را در اختیار هیچ شخص یا سایت ناشناسی قرار ندهید.</p>
</main>
</body>
</html>
